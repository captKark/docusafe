name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-app:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docusafe_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          # ✅ 1. Use the Real Secret from GitHub
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          
          # ✅ 2. Provide the Full URL (Logic: postgresql://user:pass@localhost:5432/db)
          DATABASE_URL: "postgresql://user:password@localhost:5432/docusafe_db"
          
          # ✅ 3. API Key for AI
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 
        run: |
          pytest -v